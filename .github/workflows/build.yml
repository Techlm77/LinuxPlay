name: build

on:
  push:
    branches: [main]
    # A tag like v2.0.0 also publishes a release (the release job below).
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Build in a clean container for each distro, installing exactly the
# dependencies the README lists, so a release "builds first time" everywhere.
# Runs on the ubuntu-latest runner and drives each distro with `docker run`
# (so the minimal images don't need git/node for the actions themselves).
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SDL 3 is packaged from Ubuntu 25.04 and Fedora 42 on.
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            deps: >-
              export DEBIAN_FRONTEND=noninteractive;
              apt-get update -qq;
              apt-get install -y -qq curl ca-certificates build-essential cmake pkg-config
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsdl3-dev
              libgtk-4-dev libadwaita-1-dev
          - name: Fedora 45
            image: fedora:45
            deps: >-
              dnf -y install curl gcc gcc-c++ cmake pkgconf-pkg-config
              gstreamer1-devel gstreamer1-plugins-base-devel SDL3-devel
              gtk4-devel libadwaita-devel
          - name: Arch Linux
            image: archlinux:latest
            deps: >-
              pacman -Syu --noconfirm --needed base-devel cmake curl
              gstreamer gst-plugins-base sdl3 gtk4 libadwaita
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          docker run --rm -v "$PWD":/src:ro "${{ matrix.image }}" bash -euc '
            ${{ matrix.deps }}
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            cd /src
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --release --locked
            cargo test --release --locked
          '

  # Static checks: fail on clippy's correctness and suspicious lints (style
  # lints only warn, so a new clippy release can't break the build).
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clippy
        run: |
          docker run --rm -v "$PWD":/src:ro archlinux:latest bash -euc '
            pacman -Syu --noconfirm --needed base-devel cmake curl gstreamer gst-plugins-base sdl3 gtk4 libadwaita
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy
            . "$HOME/.cargo/env"
            cd /src
            export CARGO_TARGET_DIR=/tmp/target
            cargo clippy --workspace --all-targets --locked -- -D clippy::correctness -D clippy::suspicious
          '

  # The AppImage, built on Ubuntu 24.04 as packaging/appimage/build.sh says.
  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LinuxPlay-AppImage
          path: dist/*.AppImage

  # The Flatpak bundle, from the same manifest as packaging/flatpak/build.sh.
  # Flathub's builder image; flatpak-builder's sandbox needs --privileged.
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Build directories outside the checkout, which the manifest copies.
          flatpak-builder --repo=/tmp/fp-repo --state-dir=/tmp/fp-state --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub /tmp/fp-build packaging/flatpak/io.github.techlm77.LinuxPlay.yml
          mkdir -p dist
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            /tmp/fp-repo "dist/LinuxPlay-$version-x86_64.flatpak" io.github.techlm77.LinuxPlay
      - uses: actions/upload-artifact@v4
        with:
          name: LinuxPlay-Flatpak
          path: dist/*.flatpak

  # On a version tag: publish both packages as a GitHub release, with the notes
  # from .github/release-notes/TAG.md and the files' SHA-256 checksums.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, clippy, appimage, flatpak, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG doesn't match version $version in Cargo.toml"; exit 1; }
          notes=.github/release-notes/$TAG.md
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          cd dist
          {
            cat "../$notes"
            echo
            echo "### SHA-256"
            echo
            echo '```'
            sha256sum *.flatpak *.AppImage
            echo '```'
          } > notes.md
          gh release create "$TAG" --verify-tag --title "LinuxPlay $version" --notes-file notes.md \
            *.flatpak *.AppImage

  # Known vulnerabilities in dependencies (RustSec advisory database).
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Plain cargo-audit: fails on any vulnerability, lists warnings, and
    # needs no write permission (so pull requests from forks work too).
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit
