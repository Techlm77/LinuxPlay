# Flatpak manifest for LinuxPlay.
#
# Local build (no root needed if flatpak-builder is the org.flatpak.Builder flatpak):
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#       build-dir packaging/flatpak/io.github.techlm77.LinuxPlay.yml
#
# This build fetches crates from the network (build-args: --share=network).
# A Flathub submission would vendor them instead (flatpak-cargo-generator).
id: io.github.techlm77.LinuxPlay
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: linuxplay

finish-args:
  # Peer-to-peer WebRTC and the signalling connection.
  - --share=network
  # X11 shared memory for ximagesrc.
  - --share=ipc
  # Display: Wayland with an X11 fallback; an X11 host also needs the X socket
  # for ximagesrc capture and XTEST input.
  - --socket=wayland
  - --socket=x11
  # Desktop audio in and out.
  - --socket=pulseaudio
  # GPU for VA-API encode/decode.
  - --device=dri
  # Pairing PIN, startup and status notifications.
  - --talk-name=org.freedesktop.Notifications
  # The host's tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Screen capture and input on Wayland go through the ScreenCast and
  # RemoteDesktop portals, which are always reachable from the sandbox.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/linuxplay/cargo

modules:
  - name: linuxplay
    buildsystem: simple
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/linuxplay /app/bin/linuxplay
      - install -Dm755 target/release/linuxplay-host /app/bin/linuxplay-host
      - install -Dm644 packaging/io.github.techlm77.LinuxPlay.desktop
        /app/share/applications/io.github.techlm77.LinuxPlay.desktop
      - install -Dm644 packaging/io.github.techlm77.LinuxPlay.Host.desktop
        /app/share/applications/io.github.techlm77.LinuxPlay.Host.desktop
      - install -Dm644 packaging/io.github.techlm77.LinuxPlay.svg
        /app/share/icons/hicolor/scalable/apps/io.github.techlm77.LinuxPlay.svg
      - install -Dm644 packaging/flatpak/io.github.techlm77.LinuxPlay.metainfo.xml
        /app/share/metainfo/io.github.techlm77.LinuxPlay.metainfo.xml
    sources:
      - type: dir
        path: ../..
