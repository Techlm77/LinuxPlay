[package]
name = "linuxplay"
description = "LinuxPlay: the stream window, and the engine a front end drives"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "linuxplay"
path = "src/main.rs"

[features]
bundled-sdl = ["linuxplay-client/bundled-sdl"]

[dependencies]
linuxplay-client = { path = "../client" }
linuxplay-host = { path = "../host" }
linuxplay-net.workspace = true
linuxplay-rendezvous = { path = "../rendezvous" }
linuxplay-proto.workspace = true

anyhow.workspace = true
clap.workspace = true
gstreamer.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
