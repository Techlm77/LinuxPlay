[package]
name = "linuxplay-client"
description = "LinuxPlay client: the stream window that connects to a host"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Build SDL 3 from source and link it in, for packages (the AppImage) built
# on systems that don't ship SDL 3.
bundled-sdl = ["sdl3/build-from-source-static"]

[dependencies]
linuxplay-media.workspace = true
linuxplay-net.workspace = true
linuxplay-proto.workspace = true

anyhow.workspace = true
async-channel.workspace = true
gstreamer.workspace = true
gstreamer-app.workspace = true
fontdb.workspace = true
fontdue.workspace = true
glow.workspace = true
gstreamer-gl.workspace = true
gstreamer-gl-egl.workspace = true
gstreamer-gl-wayland.workspace = true
gstreamer-video.workspace = true
sdl3.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
