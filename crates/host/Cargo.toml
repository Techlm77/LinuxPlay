[package]
name = "linuxplay-host"
description = "LinuxPlay host: shares this desktop over WebRTC"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "linuxplay-host"
path = "src/main.rs"

[dependencies]
linuxplay-net.workspace = true
linuxplay-proto.workspace = true

anyhow.workspace = true
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
clap.workspace = true
futures-util.workspace = true
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-video.workspace = true
hex.workspace = true
ksni = "0.3"
libc.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x11rb = { version = "0.14", features = ["xtest", "randr"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
